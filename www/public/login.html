<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>写生画廊</title><link rel="stylesheet" href="/public/style.css"></head>
<body><div class="login"><div class="art"></div>
<form id="f"><h1 class="serif">写生画廊</h1>
<input id="pw" type="password" placeholder="访问密码" autofocus>
<button>进入</button><div class="err" id="err"></div></form></div>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pw:document.getElementById('pw').value})});
if(r.ok){location.href='/'}else{document.getElementById('err').textContent='密码错误';document.getElementById('pw').select()}};
</script></body></html>
