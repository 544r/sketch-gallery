server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/gallery/www;
    client_max_body_size 1m;
    gzip on; gzip_types text/css application/javascript application/json;

    location = /_auth    { internal; proxy_pass http://127.0.0.1:8081/_auth;    proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    location = /_authadm { internal; proxy_pass http://127.0.0.1:8081/_authadm; proxy_pass_request_body off; proxy_set_header Content-Length ""; }
    location /api/ { client_max_body_size 12m; proxy_pass http://127.0.0.1:8081; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /public/ { add_header Cache-Control "no-cache"; }

    location /admin {
        auth_request /_authadm;
        error_page 401 = @admlogin;
        add_header Cache-Control "no-cache";
        try_files /admin/index.html =404;
    }
    location @admlogin { return 302 /public/admin-login.html; }

    location ~* \.(html|js|css)$ {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "no-cache";
    }
    location ~ \.json$ {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "no-cache";
    }
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        add_header Cache-Control "private, max-age=86400";
        try_files $uri $uri/ =404;
    }
    location @login { return 302 /public/login.html; }
}
